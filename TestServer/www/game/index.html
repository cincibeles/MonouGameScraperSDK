<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | CircleRun</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
      var unityInstance = UnityLoader.instantiate("unityContainer", "Build/game.json", {onProgress: UnityProgress});
    </script>
    <style>
      /* Forzar al contenedor y al canvas interno a respetar el formato vertical 9:16 */
      #unityContainer, #unityContainer canvas {
        width: 100% !important;
        height: auto !important;
        aspect-ratio: 9 / 16 !important;
        max-height: 100vh !important;
        max-width: calc(100vh * 9 / 16) !important;
        margin: 0 auto !important;
        display: block !important;
      }
      /* Centrar verticalmente todo el juego dentro del espacio gris de la plataforma */
      .webgl-content {
        position: absolute !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) !important;
        width: 100% !important;
        max-width: 100% !important;
      }
      /* Ocultar barra inferior gris si no deseas que altere el alto visual */
      .footer {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="webgl-content">
      <div id="unityContainer"></div>
    </div>
  </body>
</html>
